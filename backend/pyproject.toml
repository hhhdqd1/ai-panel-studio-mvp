[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-panel-studio-backend"
version = "0.1.0"
description = "Local AI roundtable discussion backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
